plugins {
    id 'com.android.application'
}

android {
    namespace 'ch.bewerbung.pdf'
    compileSdk 36

    defaultConfig {
        applicationId 'ch.bewerbung.pdf'
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.${versionCode}"
    }

    buildTypes {
        // Unsigniert: Der Schlüssel liegt nicht im (öffentlichen) Repo, signiert wird separat.
        release { minifyEnabled false }
    }

    // Die iOS-Web-App (ios-webapp/) wird 1:1 als assets/ in die APK gepackt (eine Codebasis).
    sourceSets {
        main { assets.srcDirs = ['../../ios-webapp'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
}
