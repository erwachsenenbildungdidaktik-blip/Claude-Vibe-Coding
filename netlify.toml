# iOS · Netlify: veröffentlicht nur die iOS-Web-App (ios-webapp/), nicht den Rest des Repos.
[build]
  publish = "ios-webapp"
  command = ""

# Service Worker und Startseite nie lange zwischenspeichern, damit Updates ankommen
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Sicherheit: nur eigene Dateien laden, nichts von aussen (keine CDNs, Schriften, Analytics)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
