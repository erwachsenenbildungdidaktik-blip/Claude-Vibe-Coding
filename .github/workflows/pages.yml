# GitHub Pages: veröffentlicht nur die Web-App (bewerbung-handy/).
# Einmalig nötig: Settings → Pages → Source: „GitHub Actions“.
name: Web-App auf GitHub Pages

on:
  push:
    branches: [main]
    paths: ['bewerbung-handy/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: bewerbung-handy }
      - id: deployment
        uses: actions/deploy-pages@v4
