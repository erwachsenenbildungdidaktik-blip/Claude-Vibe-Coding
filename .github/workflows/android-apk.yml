name: Android-APK bauen

on:
  push:
    paths: ['android/**', 'bewerbung-handy/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: APK bauen (unsigniert)
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: gradle -p android --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: bewerbung-pdf-unsigned
          path: android/app/build/outputs/apk/release/*.apk
      # Unsignierte APK auf Branch "apk-build" ablegen (wird anschliessend separat signiert)
      - name: Auf Branch apk-build ablegen
        run: |
          mkdir out && cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/
          echo "${{ github.run_number }} ${{ github.sha }}" > out/BUILD.txt
          cd out && git init -q -b apk-build && git add . \
            && git -c user.name=ci -c user.email=ci@localhost commit -qm "APK ${{ github.run_number }}" \
            && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-build
