name: ANDROID · APK bauen

on:
  push:
    paths: ['android-app/**', 'ios-webapp/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: APK bauen (unsigniert)
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: gradle -p android-app --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Bewerbung-PDF-Android-unsigniert
          path: android-app/app/build/outputs/apk/release/*.apk
      # Unsignierte APK auf Branch "android-apk-build" ablegen (wird anschliessend separat signiert)
      - name: Auf Branch android-apk-build ablegen
        run: |
          mkdir out && cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk out/Bewerbung-PDF-Android-unsigniert.apk
          echo "${{ github.run_number }} ${{ github.sha }}" > out/BUILD.txt
          # Offizielles apksigner aus den Build-Tools mitgeben (zum Signieren ausserhalb von GitHub)
          cp "$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)lib/apksigner.jar" out/
          cd out && git init -q -b android-apk-build && git add . \
            && git -c user.name=ci -c user.email=ci@localhost commit -qm "APK ${{ github.run_number }}" \
            && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" android-apk-build
