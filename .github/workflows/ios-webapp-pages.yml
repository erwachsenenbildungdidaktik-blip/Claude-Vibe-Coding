# iOS · Web-App für GitHub Pages: kopiert ios-webapp/ auf den Branch "ios-webapp-pages".
# Einmalig nötig: Settings → Pages → Source „Deploy from a branch“ → ios-webapp-pages / (root).
name: iOS · Web-App für GitHub Pages

on:
  push:
    paths: ['ios-webapp/**', '.github/workflows/ios-webapp-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auf Branch ios-webapp-pages ablegen
        run: |
          mkdir out && cp -r ios-webapp/. out/ && touch out/.nojekyll
          cd out && git init -q -b ios-webapp-pages && git add . \
            && git -c user.name=ci -c user.email=ci@localhost commit -qm "Web-App ${{ github.sha }}" \
            && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ios-webapp-pages
