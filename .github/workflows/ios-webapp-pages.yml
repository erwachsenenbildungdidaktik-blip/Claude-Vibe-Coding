# iOS · GitHub Pages: veröffentlicht nur die iOS-Web-App (ios-webapp/).
# Einmalig nötig: Settings → Pages → Source: „GitHub Actions“.
name: iOS · Web-App auf GitHub Pages

on:
  push:
    branches: [main]
    paths: ['ios-webapp/**', '.github/workflows/ios-webapp-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: ios-webapp }
      - id: deployment
        uses: actions/deploy-pages@v4
